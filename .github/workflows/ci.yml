name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic assessment
        run: python -m src.cli data/synthetic_flows.json --output reports/generated-assessment.md
